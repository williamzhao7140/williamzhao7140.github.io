<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Milkbun — Functional Self-Care</title>

    <meta
      name="description"
      content="Milkbun is a functional self-care app that helps you plan your day, stay focused, and build better routines with a cozy companion by your side."
    />

    <link rel="icon" type="image/png" href="/assets/icon.png" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }

      .pixel-sprite {
        image-rendering: pixelated;
      }
    </style>
  </head>

  <body class="min-h-screen bg-[#EDF1F4] text-neutral-800">
    <main
      class="flex min-h-screen flex-col items-center justify-center px-6 py-16 text-center"
    >
      <img
        src="logo.png"
        alt="Milkbun"
        class="mb-6 block h-auto w-36"
      />

      <h1 class="mb-3 text-3xl font-semibold tracking-tight">
        Milkbun
      </h1>

      <p class="mb-8 max-w-md text-base leading-relaxed text-neutral-500">
Turn everyday self-care into a cozy little world.

      </p>

      <a
        href="https://apps.apple.com"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Download Milkbun on the App Store"
        class="mb-10 inline-flex items-center gap-3 rounded-2xl bg-black px-5 py-2.5 text-white shadow-md transition hover:bg-neutral-800"
      >
        <svg
          class="h-7 w-7 shrink-0 fill-current"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.79 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09ZM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25Z"
          />
        </svg>

        <div class="text-left leading-tight">
          <div class="text-[10px] font-medium text-neutral-400">
            Download on the
          </div>

          <div class="text-base font-semibold tracking-tight">
            App Store
          </div>
        </div>
      </a>

      <nav class="flex flex-wrap items-center justify-center gap-4 text-sm text-neutral-400">
        <a class="transition hover:text-neutral-700" href="/privacy">
          Privacy
        </a>

        <span class="text-neutral-300">·</span>

        <a class="transition hover:text-neutral-700" href="/terms">
          Terms
        </a>

        <span class="text-neutral-300">·</span>

        <a class="transition hover:text-neutral-700" href="/support">
          Support
        </a>
      </nav>
    </main>
  </body>
</html>
